<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unidad 3 · Microservicios</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Orden importante: config → auth → api → crud (ui.js lo agrega Daniel al final) -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/crud-a.js"></script>
  <script src="js/crud-b.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;
    const CFG = window.CONFIG;
    const auth = () => window.App && window.App.auth;

    function useSession() {
      const [token, setToken] = useState(auth()?.getToken() || null);
      useEffect(() => {
        const t = setInterval(() => setToken(auth()?.getToken() || null), 1000);
        return () => clearInterval(t);
      }, []);
      return token;
    }

    function LoginForm({ onDone }) {
      const [user, setUser] = useState("");
      const [pass, setPass] = useState("");
      const [msg, setMsg] = useState(null);
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        setBusy(true); setMsg(null);
        try { await auth().login(user, pass); onDone(); }
        catch (err) { setMsg(err.message); }
        finally { setBusy(false); }
      }
      return (
        <form className="card" onSubmit={submit}>
          <h2>Iniciar sesión</h2>
          <label>Usuario <input value={user} onChange={e => setUser(e.target.value)} autoComplete="username" required /></label>
          <label>Contraseña <input type="password" value={pass} onChange={e => setPass(e.target.value)} autoComplete="current-password" required /></label>
          <button disabled={busy}>{busy ? "Entrando…" : "Entrar"}</button>
          {msg && <p className="msg err">{msg} (más detalle en la consola del navegador)</p>}
        </form>
      );
    }

    function SessionCard({ token }) {
      const [show, setShow] = useState(false);
      const payload = auth().decodeJwt(token);
      const exp = payload?.exp ? new Date(payload.exp * 1000) : null;
      const expired = exp && exp.getTime() < Date.now();
      return (
        <section className="card">
          <h2>Sesión</h2>
          {exp && <p>{expired ? "Expirado el " : "Expira el "}{exp.toLocaleString()}</p>}
          <textarea readOnly rows={3} value={show ? token : token.slice(0, 10) + "… (oculto)"} />
          <button onClick={() => setShow(!show)}>{show ? "Ocultar token" : "Mostrar token"}</button>{" "}
          <button onClick={() => auth().logout()}>Cerrar sesión</button>
          <pre>{payload ? JSON.stringify(payload, null, 2) : "(no se pudo decodificar)"}</pre>
        </section>
      );
    }

    // Los módulos de Nuvia/Aldair enlazan sus botones por id. React dibuja esos elementos y
    // luego se vuelve a cargar el script del módulo para que los encuentre.
    function useRebind(src) {
      useEffect(() => {
        const s = document.createElement("script");
        s.src = src + "?v=" + Date.now();
        document.body.appendChild(s);
        return () => s.remove();
      }, []);
    }

    function Crud({ p, title, src, withAIds }) {
      useRebind(src);
      const id = (n) => p + n;
      return (
        <section className="card">
          <h2>{title}</h2>
          <p id={id("Msg")} className="msg" />
          <form id={id("Form")}>
            <input type="hidden" id={id("Id")} />
            <label>Nombre <input id={id("Name")} required /></label>
            {withAIds && (
              <label>entityAIds (separados por coma)
                <input id={id("AIds")} placeholder="1,2,3" />
              </label>
            )}
            <button type="submit" id={id("Submit")}>Crear {title}</button>{" "}
            <button type="button" id={id("Cancel")} className="hidden">Cancelar</button>
          </form>
          <p><button type="button" id={id("Load")}>Cargar lista</button></p>
          <div id={id("Results")} />
        </section>
      );
    }

    function Panel({ id }) {
      return id === "entitya"
        ? <Crud p="crudA" title="ENTITYA" src="js/crud-a.js" />
        : <Crud p="crudB" title="ENTITYB" src="js/crud-b.js" withAIds />;
    }

    function Root() {
      const token = useSession();
      const [open, setOpen] = useState(null);
      useEffect(() => { if (!token) setOpen(null); }, [token]);

      return (
        <>
          <header className="app-header">
            <h1>Unidad 3 · Microservicios</h1>
            <span className={"pill" + (token ? " on" : "")}>{token ? "Sesión activa" : "Sin sesión"}</span>
          </header>
          <main className="container">
            {token ? <SessionCard token={token} /> : <LoginForm onDone={() => {}} />}
            <div className="cards">
              {CFG.CARDS.map(c => (
                <article key={c.id} className="card">
                  <h2>{c.title}</h2><p>{c.desc}</p>
                  <button disabled={!token} onClick={() => setOpen(c.id)}>
                    {token ? "Abrir" : "Inicia sesión para usar"}
                  </button>
                </article>
              ))}
            </div>
            {open && <Panel key={open} id={open} />}
          </main>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
